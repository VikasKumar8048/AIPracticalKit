[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-practical-kit"
version = "1.1.0"
description = "Beginner-friendly Python implementations of 11 AI laboratory practical algorithms, with an offline source browser"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "AIPracticalKit contributors"}
]
keywords = ["AI", "practicals", "education", "search algorithms", "backtracking", "minimax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
ai-practical-kit = "ai_practical_kit.cli:main"

[project.gui-scripts]
ai-practical-kit-gui = "ai_practical_kit.gui:main"

[tool.setuptools.packages.find]
include = ["ai_practical_kit*"]
